name: Build Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Windows runner
        run: flutter create --platforms=windows --project-name avi_music --org com.avimusic .
      - name: Set window title
        shell: bash
        run: |
          sed -i 's/L"avi_music"/L"Avi Music"/' windows/runner/main.cpp
          sed -i 's/"avi_music"/"Avi Music"/' windows/runner/main.cpp || true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build
        run: flutter build windows --release --dart-define=BUILD=${{ github.run_number }}
      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath AviMusic-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: AviMusic-windows
          path: AviMusic-windows.zip
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Avi Music build ${{ github.run_number }}
          files: AviMusic-windows.zip
          make_latest: true
