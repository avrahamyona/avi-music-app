name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'bus.js'
      - 'config.js'
      - 'player.windows.js'
      - 'windows-native/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create plain React Native 0.76 project
        shell: bash
        run: |
          npx --yes @react-native-community/cli@15 init AviWin --version 0.76.9 --skip-install --skip-git-init --pm npm
      - name: Install deps and react-native-windows
        shell: bash
        working-directory: AviWin
        run: |
          npm install
          npm install react-native-windows@^0.76.0
          npx react-native init-windows --template cpp-app --overwrite --no-telemetry
      - name: Copy shared app code
        shell: bash
        run: |
          cp App.js bus.js config.js player.windows.js AviWin/
          cp player.native.js player.web.js AviWin/ || true
          sed -i "s/|| 'dev')/|| '${{ github.run_number }}')/" AviWin/App.js
          cat > AviWin/index.js <<'JS'
          import { AppRegistry } from 'react-native';
          import App from './App';
          AppRegistry.registerComponent('AviWin', () => App);
          JS
      - name: Build (release, x64)
        shell: pwsh
        working-directory: AviWin
        run: npx react-native run-windows --release --no-launch --no-deploy --arch x64 --logging --no-telemetry
      - name: Build installer (.exe)
        shell: pwsh
        run: |
          $pkg = Get-ChildItem -Directory AviWin/windows/AviWin.Package/AppPackages | Where-Object { $_.Name -like '*_Test' } | Select-Object -First 1
          if (-not $pkg) { throw 'no Test package folder' }
          Write-Host "Package folder: $($pkg.FullName)"
          Get-ChildItem $pkg.FullName | Select-Object Name
          choco install innosetup -y --no-progress
          $iss = @"
          [Setup]
          AppName=Avi Music
          AppVersion=0.2.0.${{ github.run_number }}
          DefaultDirName={tmp}\AviMusicSetup
          PrivilegesRequired=admin
          OutputDir=out
          OutputBaseFilename=AviMusic-Setup
          Compression=lzma
          SolidCompression=yes
          DisableDirPage=yes
          DisableProgramGroupPage=yes
          Uninstallable=no
          CreateAppDir=no
          [Files]
          Source: "$($pkg.FullName)\*"; DestDir: "{tmp}\AviMusicPkg"; Flags: recursesubdirs createallsubdirs deleteafterinstall
          [Run]
          Filename: "powershell.exe"; Parameters: "-NoProfile -ExecutionPolicy Bypass -File ""{tmp}\AviMusicPkg\Add-AppDevPackage.ps1"" -Force"; StatusMsg: "Installing Avi Music..."; Flags: waituntilterminated
          "@
          Set-Content -Path AviMusic.iss -Value $iss
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" AviMusic.iss
          Get-ChildItem out
      - uses: actions/upload-artifact@v4
        with:
          name: AviMusic-Setup
          path: out/AviMusic-Setup.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Avi Music Windows ${{ github.run_number }}
          files: out/AviMusic-Setup.exe
