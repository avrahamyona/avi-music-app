name: Windows

on:
  push:
    branches: [main]
    paths:
      - 'App.js'
      - 'bus.js'
      - 'config.js'
      - 'player.windows.js'
      - 'windows-native/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows
  cancel-in-progress: true

jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Create plain React Native 0.76 project
        shell: bash
        run: |
          npx --yes @react-native-community/cli@15 init AviWin --version 0.76.9 --skip-install --skip-git-init --pm npm
      - name: Install deps and react-native-windows
        shell: bash
        working-directory: AviWin
        run: |
          npm install
          npm install react-native-windows@^0.76.0
          npx react-native init-windows --template cpp-app --overwrite --no-telemetry
      - name: Copy shared app code
        shell: bash
        run: |
          cp App.js bus.js config.js player.windows.js storage.js storage.windows.js moods.js Icon.windows.js audioSrc.js account.js AccountPanel.js AviWin/
          cp player.native.js player.web.js AviWin/ || true
          sed -i "s/|| 'dev'/|| '${{ github.run_number }}'/" AviWin/App.js
          find AviWin/windows -maxdepth 3 -not -path '*/node_modules/*' | head -80
          grep -rn "AddAttributedModules\|ReactPackageProvider" AviWin/windows --include=*.cpp --include=*.h -l | head
          rp=$(grep -rl "AddAttributedModules" AviWin/windows --include=*.cpp | head -1)
          if [ -z "$rp" ]; then rp=$(find AviWin/windows -name 'ReactPackageProvider.cpp' | head -1); fi
          echo "provider: $rp"
          cp windows-native/AviAudio.h "$(dirname "$rp")/AviAudio.h"
          sed -i 's/#include "NativeModules.h"/#include "NativeModules.h"\n#include "AviAudio.h"/' "$rp"
          grep -n AviAudio "$rp"
          mf=$(find AviWin/windows -name Package.appxmanifest | head -1)
          echo "manifest: $mf"
          sed -i 's/>AviWin</>Avi Music</; s/DisplayName="AviWin"/DisplayName="Avi Music"/' "$mf"
          cat > AviWin/index.js <<'JS'
          import { AppRegistry } from 'react-native';
          import App from './App';
          AppRegistry.registerComponent('AviWin', () => App);
          JS
      - name: Brand images (website icon)
        shell: bash
        continue-on-error: true
        run: |
          pip install pillow
          python - <<'PY'
          import urllib.request, io, glob, os
          from PIL import Image
          raw = urllib.request.urlopen('https://avrahamyona.github.io/nagan-tzaf/icon-512.png', timeout=30).read()
          ic = Image.open(io.BytesIO(raw)).convert('RGBA')
          red = (250, 45, 72, 255)
          for p in glob.glob('AviWin/windows/**/Images/*.png', recursive=True):
              w, h = Image.open(p).size
              side = int(min(w, h) * (1.0 if w == h else 0.8))
              tile = ic.resize((side, side), Image.LANCZOS)
              bg = Image.new('RGBA', (w, h), red if w != h else (0, 0, 0, 0))
              bg.alpha_composite(tile, ((w - side) // 2, (h - side) // 2))
              bg.save(p)
          ic.resize((256, 256), Image.LANCZOS).save('AviMusic.ico', sizes=[(256, 256), (64, 64), (48, 48), (32, 32), (16, 16)])
          print('branded', len(glob.glob('AviWin/windows/**/Images/*.png', recursive=True)))
          PY
      - name: Build (release, x64)
        shell: pwsh
        working-directory: AviWin
        run: npx react-native run-windows --release --no-launch --no-deploy --arch x64 --logging --no-telemetry
      - name: Sign package and build installer (.exe)
        shell: pwsh
        run: ./windows-native/package.ps1 -Build ${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: AviMusic-Setup
          path: out/AviMusic-Setup.exe
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: win-${{ github.run_number }}
          name: Avi Music Windows ${{ github.run_number }}
          files: out/AviMusic-Setup.exe
