name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - name: Generate app icon
        run: |
          pip install pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import os
          os.makedirs('assets', exist_ok=True)
          im = Image.new('RGBA', (1024, 1024), (250, 45, 72, 255))
          d = ImageDraw.Draw(im)
          d.ellipse((212, 212, 812, 812), fill=(255, 255, 255, 255))
          d.polygon([(420, 360), (420, 664), (690, 512)], fill=(250, 45, 72, 255))
          im.save('assets/icon.png')
          PY
      - name: Export web
        run: npx expo export -p web
      - name: Upload web for Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Zip web
        run: cd dist && zip -r ../AviMusic-web.zip .
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AviMusic.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Avi Music app ${{ github.run_number }}
          files: |
            AviMusic.apk
            AviMusic-web.zip
          make_latest: true

  deploy-web:
    needs: android-and-web
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
