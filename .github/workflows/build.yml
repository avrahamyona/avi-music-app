name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: true

jobs:
  android-and-web:
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_BUILD: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npx expo install --fix
      - name: Export web
        run: npx expo export -p web
      - name: Zip web
        run: cd dist && zip -r ../AviMusic-web.zip .
      - name: Prebuild Android
        run: npx expo prebuild --platform android --no-install
      - name: Build APK
        run: cd android && chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Collect APK
        run: cp android/app/build/outputs/apk/release/app-release.apk AviMusic.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: app-${{ github.run_number }}
          name: Avi Music app ${{ github.run_number }}
          files: |
            AviMusic.apk
            AviMusic-web.zip
          make_latest: true
